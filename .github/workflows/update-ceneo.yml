name: Aktualizacja ofert partnerskich

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: partner-catalog-update
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Sprawdź składnię i testy importera
        run: |
          python3 -m py_compile scripts/update_ceneo.py scripts/update_awin.py
          python3 -m unittest discover -s tests -v

      - name: Pobierz produkty z Ceneo (jeśli skonfigurowano dostęp)
        env:
          CENEO_API_KEY: ${{ secrets.CENEO_API_KEY }}
          CENEO_PARTNER_ID: ${{ secrets.CENEO_PARTNER_ID }}
          CENEO_SEARCH_TERMS: ${{ vars.CENEO_SEARCH_TERMS }}
        run: python3 scripts/update_ceneo.py

      - name: Importuj feed Awin (jeśli skonfigurowano dostęp)
        env:
          AWIN_FEED_URL: ${{ secrets.AWIN_FEED_URL }}
        run: python3 scripts/update_awin.py

      - name: Zapisz zaktualizowany katalog
        run: |
          if [ -f products.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products.json
            if ! git diff --cached --quiet; then
              git commit -m "Aktualizacja katalogu ofert partnerskich"
              git push
            else
              echo "Brak zmian w katalogu."
            fi
          else
            echo "Brak skonfigurowanych feedów. Katalog demonstracyjny pozostaje bez zmian."
          fi
