name: Kontrola jakości projektu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sprawdź składnię importerów
        run: python -m py_compile scripts/update_ceneo.py scripts/update_awin.py
      - name: Uruchom testy
        run: python -m unittest discover -s tests -v
