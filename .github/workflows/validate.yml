name: Kontrola jakości projektu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Skonfiguruj Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Sprawdź składnię importerów
        run: python -m py_compile scripts/update_ceneo.py scripts/update_awin.py
      - name: Sprawdź składnię JavaScript
        run: node --check app.js
      - name: Uruchom testy
        run: python -m unittest discover -s tests -v
